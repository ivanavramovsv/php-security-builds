name: PHP source provenance audit (ARM64 / Ubuntu 20.04)

on:
  push:
    branches:
      - setup/arm64-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - name: Install audit utilities in disposable container
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl python3 xz-utils file
      - name: Check out source audit scripts
        uses: actions/checkout@v4
      - name: Verify ARM64, Focal, and exact historical package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/source_audit.py
          python3 scripts/source_audit.py --output reports/source-audit.json
      - name: Show provenance report even when sources are unavailable
        if: always()
        run: |
          if [ -f reports/source-audit.json ]; then cat reports/source-audit.json; fi
      - name: Check official PHP 8.2.35 source archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            https://www.php.net/distributions/php-8.2.35.tar.xz \
            --output /tmp/php-8.2.35.tar.xz
          echo '5737b98601fe5ab1b8c5db0c82ed3158acb9283ed3081ffe2faffb9ac81455e6  /tmp/php-8.2.35.tar.xz' | sha256sum --check
          file /tmp/php-8.2.35.tar.xz
          echo 'UPSTREAM_SHA256=PASS' > reports/upstream-check.txt
      - name: Upload diagnostic report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php82-source-audit
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  historical-packaging-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - name: Install read-only source audit dependencies
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git python3
      - name: Check out audit scripts
        uses: actions/checkout@v4
      - name: Verify historical Debian PHP Team tags and packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/salsa_history_audit.py
          python3 scripts/salsa_history_audit.py --output reports/salsa-history.json
      - name: Print complete audit result
        if: always()
        shell: bash
        run: |
          if [ -f reports/salsa-history.json ]; then cat reports/salsa-history.json; fi
      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php82-historical-packaging-audit
          path: reports/salsa-history.json
          if-no-files-found: warn
          retention-days: 14

  launchpad-publishing-forensics:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - name: Install diagnostic dependencies in ephemeral Focal container
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates python3
      - name: Check out diagnostic script
        uses: actions/checkout@v4
      - name: Inspect exact historic Launchpad source publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/launchpad_forensics.py
          python3 scripts/launchpad_forensics.py --output reports/launchpad-forensics.json
      - name: Display source and build provenance
        if: always()
        shell: bash
        run: |
          if [ -f reports/launchpad-forensics.json ]; then
            cat reports/launchpad-forensics.json
          fi
      - name: Upload metadata report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php82-launchpad-publishing-forensics
          path: reports/launchpad-forensics.json
          if-no-files-found: error
          retention-days: 14

  historical-arm64-build-evidence:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - name: Install evidence inspection tools in disposable container
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates python3
      - name: Check out audit script
        uses: actions/checkout@v4
      - name: Audit original September 2024 ARM64 build files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m py_compile scripts/build_evidence_audit.py
          python3 scripts/build_evidence_audit.py --output reports/build-evidence.json
      - name: Display filtered metadata and accessibility
        if: always()
        shell: bash
        run: |
          if [ -f reports/build-evidence.json ]; then
            cat reports/build-evidence.json
          fi
      - name: Upload diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php82-original-arm64-build-evidence
          path: reports/build-evidence.json
          if-no-files-found: error
          retention-days: 14
