name: PHP 8.2.35 upstream ARM64 smoke build (no .deb)

on:
  push:
    branches:
      - setup/arm64-source-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-upstream-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-upstream-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - name: Prepare disposable build environment only
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl xz-utils make gcc g++ \
            pkg-config autoconf libxml2-dev
      - name: Verify SHA256 of exact official PHP source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/php-smoke reports
          curl --fail --location --silent --show-error --retry 2 \
            https://www.php.net/distributions/php-8.2.35.tar.xz \
            --output /tmp/php-smoke/php-8.2.35.tar.xz
          echo '5737b98601fe5ab1b8c5db0c82ed3158acb9283ed3081ffe2faffb9ac81455e6  /tmp/php-smoke/php-8.2.35.tar.xz' | sha256sum --check
          tar -xJf /tmp/php-smoke/php-8.2.35.tar.xz -C /tmp/php-smoke
      - name: Build only minimal CLI and FPM to prove ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/php-smoke/php-8.2.35
          ./configure --disable-all --enable-cli --enable-fpm --disable-cgi --without-pear \
            > /tmp/php-smoke/configure.log 2>&1
          make -j2 > /tmp/php-smoke/build.log 2>&1
          sapi/cli/php -v | tee /tmp/php-smoke/cli-version.txt
          sapi/fpm/php-fpm -v | tee /tmp/php-smoke/fpm-version.txt
          sapi/cli/php -r 'if (PHP_VERSION !== "8.2.35") exit(10); echo "PHP_SMOKE=PASS\n";' \
            | tee /tmp/php-smoke/smoke.txt
          echo 'TARGET=Ubuntu 20.04 arm64' > "$GITHUB_WORKSPACE/reports/upstream-smoke.txt"
          cat /tmp/php-smoke/{cli-version,fpm-version,smoke}.txt >> "$GITHUB_WORKSPACE/reports/upstream-smoke.txt"
          echo 'NO_DEBIAN_PACKAGES_BUILT=true' >> "$GITHUB_WORKSPACE/reports/upstream-smoke.txt"
          echo 'PRODUCTION_DEPLOYMENT=false' >> "$GITHUB_WORKSPACE/reports/upstream-smoke.txt"
      - name: Print failure diagnostics without publishing binaries
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/php-smoke/configure.log ]; then tail -60 /tmp/php-smoke/configure.log; fi
          if [ -f /tmp/php-smoke/build.log ]; then tail -100 /tmp/php-smoke/build.log; fi
      - name: Upload smoke report only, never executable binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php82-upstream-arm64-smoke
          path: reports/upstream-smoke.txt
          if-no-files-found: warn
          retention-days: 14
